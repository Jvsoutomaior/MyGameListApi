services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mygamelist
      POSTGRES_USER: mygamelist
      POSTGRES_PASSWORD: mygamelist
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygamelist -d mygamelist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
