services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mygamelist
      POSTGRES_USER: mygamelist
      POSTGRES_PASSWORD: mygamelist
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygamelist -d mygamelist"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: mygamelist-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mygamelist
      DATABASE_USERNAME: mygamelist
      DATABASE_PASSWORD: mygamelist
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src:/workspace/src:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/auth/csrf"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
volumes:
  postgres-data:
