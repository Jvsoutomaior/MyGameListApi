spring.application.name=MyGameListApi
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mygamelist}
spring.datasource.username=${DATABASE_USERNAME:mygamelist}
spring.datasource.password=${DATABASE_PASSWORD:mygamelist}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
