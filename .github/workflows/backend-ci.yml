name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify and package API
        run: ./mvnw --batch-mode clean verify
      - name: Upload executable JAR
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: mygamelist-api-jar
          path: target/mygamelist-api-*.jar
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact

      - name: Publish and verify on Lightsail
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.BACKEND_DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.BACKEND_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping deployment because a newer commit is on main."
            exit 0
          fi

          jars=(artifact/*.jar)
          [[ ${#jars[@]} -eq 1 && -s "${jars[0]}" ]]
          : "${DEPLOY_KEY:?}" "${DEPLOY_HOST_KEY:?}" "${DEPLOY_HOST:?}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=10 \
            -i "$ssh_dir/key" "mygamelist-api-deploy@$DEPLOY_HOST" \
            "deploy $GITHUB_RUN_ID" < "${jars[0]}"
