name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify and package API
        run: ./mvnw --batch-mode clean verify
      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: mygamelist-api-jar
          path: target/mygamelist-api-*.jar
          if-no-files-found: error
